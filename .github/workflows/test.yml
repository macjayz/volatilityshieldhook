name: test

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
      - run: forge test -vv
        env:
          FOUNDRY_PROFILE: ci
          # optional: the mainnet fork tests run only when this secret is set
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
