[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 44444444
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 256

[profile.ci.fuzz]
runs = 2000

[invariant]
runs = 64
depth = 64
fail_on_revert = true

[profile.ci.invariant]
runs = 256
depth = 100
fail_on_revert = true
